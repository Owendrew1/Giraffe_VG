# Pangenome graph (Trep_pangenome outputs on scratch).
pangenome_results_dir: "/scratch/odrew060/Trep_pangenome/results/trifolium_repens"
pangenome_done_flag: "/scratch/odrew060/Trep_pangenome/pangenome.done"

# Linear UTM haploid for surject / GATK (index_Trep_refs on scratch).
linear_ref_dir: "/scratch/references/trifolium/repens"
linear_ref_use_haplotype_subdir: false
index_done_flag: "/scratch/references/trifolium/repens/Trep_ref_indexing.done"

graphs_csv: "../resources/graphs.csv"

# James align_trifolium_reads TSV (column: sample). FASTQs discovered under fastq_dir.
# Test cohort: "../resources/samples_test.tsv"
samples_file: "../resources/all_clover_samples.txt"

output_dir: "/scratch/odrew060/Giraffe_vg"
fastq_dir: "/archive/raw_data/fastq"
skip_missing_fastqs: false

# Parallelize across samples at the read stage (supervisor: 32–48 cores).
cores: 32
mem_mb: 32000
read_group: "ID:{sample} SM:{sample} PL:ILLUMINA"

# Primary outputs (James-style post-alignment + pangenome-specific).
outputs:
  bam: true                 # markdup BAM (after surject)
  gam: false                # keep merged GAM (large)
  vg_call_vcf: true         # vg call on graph
  vcf_filter: true          # bcftools filter + stats on vg VCF
  linear_small_variants: false
  sv_regions: false
  qc_flagstat: true
  qc_mosdepth: true
  qc_vg_stats: true
